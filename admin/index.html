<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Propiedades — Administración</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --verde:  #1F3216;
      --verde2: #2d4a20;
      --crema:  #FFFCEB;
      --acento: #EE7A13;
      --acento2:#c9650d;
      --borde:  #e8e3d5;
    }

    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--crema); }

    /* ── Top bar ── */
    [class*="AppHeader"],
    [class*="app-header"],
    header[role="banner"] {
      background: var(--verde) !important;
      border-bottom: none !important;
      box-shadow: 0 2px 10px rgba(0,0,0,.25) !important;
    }
    [class*="AppHeader"] a,
    [class*="AppHeader"] span {
      color: rgba(255,252,235,.9) !important;
      font-weight: 500 !important;
    }

    /* ── Ocultar "Añadir rápido" ── */
    [class*="QuickCreate"],
    [data-testid="quick-add"] {
      display: none !important;
    }

    /* ── Sidebar ── */
    [class*="Nav"],
    [class*="Sidebar"],
    nav[class*="sidebar"] {
      background: #162410 !important;
      border-right: 1px solid rgba(255,255,255,.07) !important;
    }
    [class*="Nav"] a,
    [class*="Nav"] button,
    [class*="Sidebar"] a,
    [class*="Sidebar"] button {
      color: rgba(255,252,235,.72) !important;
      border-radius: 6px !important;
      transition: background .15s !important;
    }
    [class*="Nav"] a:hover,
    [class*="Nav"] a[class*="active"],
    [class*="Sidebar"] a:hover,
    [class*="Sidebar"] a[class*="active"] {
      background: rgba(238,122,19,.28) !important;
      color: #fff !important;
    }

    /* ── Fondo principal — todo crema ── */
    [class*="App"],
    [class*="app-container"],
    main,
    [class*="Page"],
    [class*="Collection"],
    [class*="EditorContainer"],
    [class*="Editor"] {
      background: var(--crema) !important;
    }

    /* ── Cards de colección ── */
    [class*="Card"],
    [class*="card"] {
      background: #fff !important;
      border: 1px solid var(--borde) !important;
      border-radius: 10px !important;
      box-shadow: 0 2px 6px rgba(0,0,0,.05) !important;
      transition: box-shadow .2s, transform .2s !important;
    }
    [class*="Card"]:hover,
    [class*="card"]:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,.1) !important;
      transform: translateY(-2px) !important;
    }

    /* ── Labels ── */
    [class*="ControlLabel"],
    [class*="control-label"],
    label {
      color: var(--verde) !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      letter-spacing: .07em !important;
      text-transform: uppercase !important;
    }

    /* ── Inputs y textareas ── */
    input[type="text"],
    input[type="number"],
    input[type="url"],
    input[type="email"],
    select {
      background: #fff !important;
      border: 1.5px solid var(--borde) !important;
      border-radius: 7px !important;
      color: #1a1a1a !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 14px !important;
      transition: border-color .2s !important;
    }
    textarea {
      background: #fff !important;
      border: 1.5px solid var(--borde) !important;
      border-radius: 7px !important;
      color: #1a1a1a !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 14px !important;
      min-height: 140px !important;
      resize: vertical !important;
      line-height: 1.65 !important;
      transition: border-color .2s !important;
    }
    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--acento) !important;
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(238,122,19,.15) !important;
    }

    /* ── Markdown editor ── */
    [class*="RichTextEditor"],
    [class*="richtext"],
    [class*="Editor__editor"] {
      background: #fff !important;
      border: 1.5px solid var(--borde) !important;
      border-radius: 7px !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 14px !important;
      line-height: 1.65 !important;
      color: #1a1a1a !important;
    }
    [class*="Toolbar"],
    [class*="toolbar"] {
      background: var(--crema) !important;
      border-bottom: 1px solid var(--borde) !important;
      border-radius: 7px 7px 0 0 !important;
    }
    [class*="Toolbar"] button,
    [class*="toolbar"] button {
      color: var(--verde) !important;
      border-radius: 4px !important;
    }
    [class*="Toolbar"] button:hover,
    [class*="toolbar"] button:hover,
    [class*="Toolbar"] button[class*="active"],
    [class*="toolbar"] button[class*="active"] {
      background: rgba(238,122,19,.15) !important;
      color: var(--acento) !important;
    }

    /* ── Botón publicar ── */
    button[class*="success"],
    button[class*="primary"],
    [class*="PublishButton"] {
      background: var(--acento) !important;
      border-color: var(--acento) !important;
      border-radius: 7px !important;
      font-weight: 600 !important;
      color: #fff !important;
    }
    button[class*="success"]:hover,
    button[class*="primary"]:hover {
      background: var(--acento2) !important;
    }
    button[class*="delete"],
    button[class*="danger"] { border-radius: 7px !important; }

    /* ── Toggle boolean ── */
    [class*="ToggleBackground"] { background: var(--borde) !important; }
    [class*="ToggleBackground"][class*="active"] { background: var(--acento) !important; }

    /* ── Upload imagen ── */
    [class*="ImageUploadButton"],
    [class*="FileUploadButton"] {
      border: 2px dashed var(--acento) !important;
      border-radius: 10px !important;
      background: rgba(238,122,19,.04) !important;
      color: var(--verde) !important;
    }

    /* ── Hints ── */
    [class*="HintText"],
    [class*="hint"] {
      color: #888 !important;
      font-size: 11px !important;
    }

    /* ── Scrollbar ── */
    * { scrollbar-width: thin; scrollbar-color: var(--acento) transparent; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--acento); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    var _obs = new MutationObserver(function() {
      document.querySelectorAll('a, button, span, li').forEach(function(el) {
        if (el.children.length === 0 && el.textContent.trim() === 'Medios') {
          el.textContent = 'Imágenes';
        }
      });
      document.querySelectorAll('button').forEach(function(btn) {
        var t = btn.textContent.trim();
        if (t === 'Añadir rápido' || t === 'Quick add' || t.startsWith('Añadir rápido')) {
          btn.style.display = 'none';
        }
      });
    });
    _obs.observe(document.body, { childList: true, subtree: true, characterData: true });
  </script>
</body>
</html>
