backend:
  name: git-gateway
  branch: main

media_folder: "fotos/propiedades"
public_folder: "/fotos/propiedades"

locale: es

# Logo de Solar en la pantalla de login y el header del panel
logo_url: /fotos/LOGO.PNG

collections:
  - name: propiedades
    label: Propiedades
    label_singular: Propiedad
    folder: content/propiedades
    create: true
    slug: "{{fields.codigo}}"
    identifier_field: codigo
    summary: "{{fields.codigo}} — {{fields.titulo}}"
    thumbnail: fotos
    fields:
      - label: "Código"
        name: codigo
        widget: string
        required: true
        hint: "Ej: LO-615"

      - label: "Título"
        name: titulo
        widget: string
        required: true

      - label: "Tipo"
        name: tipo
        widget: select
        options:
          - Lote
          - Casa
          - "Alquiler permanente"
          - "Alquiler turístico"
        required: true

      - label: "Precio"
        name: precio
        widget: string
        required: true
        hint: "Ej: 85000"

      - label: "Moneda"
        name: moneda
        widget: select
        options:
          - USD
          - ARS
        default: "USD"

      - label: "Superficie total (m²)"
        name: metros_cuadrados
        widget: number
        required: false
        value_type: int
        min: 0
        hint: "Metros cuadrados totales"

      - label: "Superficie cubierta (m²)"
        name: metros_cubiertos
        widget: number
        required: false
        value_type: int
        min: 0

      - label: "Superficie del terreno (m²)"
        name: metros_terreno
        widget: number
        required: false
        value_type: int
        min: 0

      - label: "Ambientes"
        name: ambientes
        widget: number
        required: false
        value_type: int
        min: 0

      - label: "Dormitorios"
        name: dormitorios
        widget: number
        required: false
        value_type: int
        min: 0

      - label: "Baños"
        name: banos
        widget: number
        required: false
        value_type: int
        min: 0

      - label: "Antigüedad (años)"
        name: antiguedad
        widget: number
        required: false
        value_type: int
        min: 0
        hint: "Años de antigüedad. Dejar vacío si es a estrenar."

      - label: "Zona / Barrio"
        name: zona
        widget: string
        required: false
        hint: "Ej: Barrio Norte"

      - label: "Localidad"
        name: localidad
        widget: string
        required: false
        hint: "Ej: Villa La Angostura"

      - label: "Coordenadas (Google Maps)"
        name: coordenadas
        widget: string
        required: false
        hint: "Pegá las coordenadas de Google Maps. Ej: -40.749944, -71.656222 o 40°44'59.8\"S 71°39'22.4\"W"

      - label: "Características"
        name: caracteristicas
        widget: list
        required: false
        hint: "Una característica por ítem (ej: Cochera, Pileta, Vista al lago). Aparecen como #hashtags y se pueden filtrar en el buscador."
        field:
          label: Característica
          name: caracteristica
          widget: string

      - label: "Descripción"
        name: descripcion
        widget: markdown
        required: false
        hint: "Podés usar Enter para separar párrafos, - para listas, **negrita**, etc."

      - label: "Fotos"
        name: fotos
        widget: list
        max: 20
        required: false
        field:
          label: Foto
          name: foto
          widget: image

      - label: "Link Reel / Video"
        name: link_reel
        widget: string
        required: false
        hint: "Link a reel de Instagram o video de YouTube"

      - label: "Destacada"
        name: destacada
        widget: boolean
        default: false
        hint: "Activar para que aparezca en el home"
